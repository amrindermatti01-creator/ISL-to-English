project:
  name: "ISL-Detection-and-English-Converter"
  version: "1.0.0"
  random_seed: 42

dataset:
  kaggle_slug: "prathumarikeri/indian-sign-language-isl"
  raw_dir: "C:/Users/hp/Indian"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  supported_extensions: [".jpg", ".jpeg", ".png"]

preprocessing:
  target_size: [64, 64]
  color_mode: "grayscale" # "grayscale" | "rgb"
  threshold_value: 90
  use_canny: true
  canny_low: 50
  canny_high: 150
  normalize: true # scale to [0, 1]

training:
  batch_size: 16
  epochs_benchmark: 5
  epochs_max: 25
  learning_rate: 0.001
  optimizer: "adam"
  loss: "sparse_categorical_crossentropy"
  patience_early_stopping: 5
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

inference:
  confidence_threshold: 0.70
  smoothing_frames: 5
  no_sign_label: "No reliable sign detected"
  camera_index: 0
  pad_x_ratio: 0.15      # independent horizontal padding (15%)
  pad_y_ratio: 0.15      # independent vertical padding (15%)
  edge_margin: 8         # boundary truncation guard margin (pixels)
  enable_segmentation: false # optional pixel segmentation (default disabled)

artifacts:
  model_dir: "artifacts"
  reports_dir: "reports"

modernization:
  active_engine: "landmark_mlp"       # "landmark_mlp" | "cnn_legacy"
  landmark_model_path: "artifacts/landmark_model.keras"
  landmark_mapping_path: "artifacts/landmark_class_mapping.json"
  target_language: "hi"               # Default translation target language ("hi", "pa", "ta", "bn", "en")
  tts_enabled: false                  # Audio speech toggle
  confirm_threshold: 1.0              # Seconds to hold sign to register letter
  space_threshold: 1.2                # Seconds to hold closed fist to trigger SPACE (word boundary)
  groq_model: "llama-3.1-8b-instant"  # Online LLM model for word reconstruction
