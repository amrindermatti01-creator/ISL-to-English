project:
  name: "ISL-Detection-and-English-Converter"
  version: "1.0.0"
  random_seed: 42

dataset:
  kaggle_slug: "prathumarikeri/indian-sign-language-isl"
  raw_dir: "C:/Users/hp/Indian"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  supported_extensions: [".jpg", ".jpeg", ".png"]

preprocessing:
  target_size: [64, 64]
  color_mode: "grayscale" # "grayscale" | "rgb"
  threshold_value: 90
  use_canny: true
  canny_low: 50
  canny_high: 150
  normalize: true # scale to [0, 1]

training:
  batch_size: 16
  epochs_benchmark: 5
  epochs_max: 25
  learning_rate: 0.001
  optimizer: "adam"
  loss: "sparse_categorical_crossentropy"
  patience_early_stopping: 5
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

inference:
  confidence_threshold: 0.50
  smoothing_frames: 5
  stability_duration: 0.50 # seconds required to commit sign into sentence buffer
  no_sign_label: "No reliable sign detected"
  camera_index: 0
  roi_scale_factor: 1.15 # expansion around MediaPipe hand bounding box

artifacts:
  model_dir: "artifacts"
  reports_dir: "reports"
